[Parameters]
# CianChatService - основная служба (боевая БД).
# ini читается как <имя exe>.ini UTF-8 рядом с exe; лог - <имя exe>_Log.txt.
# Секреты (Token, SetlToken, WebhookSecret) заполняются на сервере рядом с exe,
# в репозитории остаются пустыми (см. WIKI p.5). Пустой Token - служба не работает
# с Циан (webhook/From=SETL -> 503); пустой SetlToken - все From=SETL -> 403.

# ServerPort: порт слушателя (у каждой службы на сервере - свой)
ServerPort=8114
# LogHistPath: папка хранения логов (относительно exe)
LogHistPath=LogHistory
# MaxLogSize: максимальный размер лог-файла (Byte)
MaxLogSize=1000000
# Директория временного размещения файлов чатов
PathTempFiles=\\mserver\kk\Документы_по_чатам\
# Имя сервера (боевая mossqlcrp.corppn.ru, стенд mosqa01\instance1)
ServerName=mossqlcrp.corppn.ru
#ServerName=mosqa01\instance1
# Имя БД (боевая re2a, стенд re2a_stand)
DBName=re2a
#DBName=re2a_stand
# Включить дополнительные параметры (к сообщению в БД дописывается время)
DebugMode=0
# Получить текущие подписки вебхуков при старте
CheckSubscribe=1
# Зарегистрировать получателя вебхуков при старте, если нет активных подписок
SetSubscribe=1
# Отписать получателя от вебхуков при старте (перекрывает SetSubscribe). Порядок смены
# WebhooksURL: запуск с SetUnSubscribe=1 -> затем новый URL + SetUnSubscribe=0.
SetUnSubscribe=0
# Адрес пересылки (публичный). В пути обязательно "cian"; маршрут на прокси до :8114.
# При включении WebhookSecret добавить его сегментом пути: .../chatcian2_send/<WebhookSecret>/
WebhooksURL=https://tone.setl.ru/chatcian2_send/
# Секретный сегмент пути вебхука (>= 32 символов, латиница и цифры). Пусто - без проверки.
WebhookSecret=
# Адрес-идентификатор (код сайта для поиска оператора, @FromSite)
MainDescription=public-api.cian.ru
# Токен подключения к Циан (свой для каждой службы). Пусто - служба не работает с Циан.
Token=
# Защитный токен SETL: заголовок X-Setl-Token или параметр SetlToken. Пусто - все From=SETL -> 403.
SetlToken=
